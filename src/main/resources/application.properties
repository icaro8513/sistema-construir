# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/construir_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Tamaño máximo para archivos (por ejemplo, fotos de trabajos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (usa una clave larga, 64+ chars)
jwt.secret=este_es_un_secreto_ultra_largo_de_64+_caracteres_para_hmac_sha_256_1234567890abcdef
# Duración del token JWT: 10 minutos
jwt.expiration-ms=600000


# Puerto del servidor
server.port=8080

